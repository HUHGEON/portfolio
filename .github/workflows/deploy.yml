name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 — 진행 중 배포는 취소하지 않고 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export, base path /portfolio)
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      # the A4 summary PDF is rendered from the built site so it can never drift
      # from the pages; if this step fails, the committed public/ copy stays in place
      - name: Render summary PDF from the built site
        continue-on-error: true
        run: |
          mkdir -p .pdf-serve
          ln -sfn "$PWD/out" .pdf-serve/portfolio
          python3 -m http.server 4173 --directory .pdf-serve &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/portfolio/print/ && break
            sleep 1
          done
          node scripts/export-pdf.mjs http://localhost:4173/portfolio/print/ out/heo-geon-portfolio.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
